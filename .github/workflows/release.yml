name: Release

# 打 tag（如 v1.0.0）时自动构建全平台并发布 Release；
# 也支持在 Actions 页面手动触发用于测试（仅构建产物，不发 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release 需要写权限来创建 Release

jobs:
  build:
    name: Build ${{ matrix.wails-platform }}
    strategy:
      fail-fast: false # 单个目标失败不影响其它目标继续构建
      matrix:
        include:
          # Linux：amd64 (x64)。
          # 注：wails v2 不支持 linux/386（仅 amd64/arm64/arm），故不产出 x86。
          - runs-on: ubuntu-22.04
            wails-platform: linux/amd64
            artifact: ssh-tunnel-${{ github.ref_name }}-linux-amd64
          # Windows：amd64 (x64) + 386 (x86)
          - runs-on: windows-latest
            wails-platform: windows/amd64
            artifact: ssh-tunnel-${{ github.ref_name }}-windows-amd64
            nsis: 'true' # NSIS 仅 windows/amd64 与 windows/arm64 支持
          - runs-on: windows-latest
            wails-platform: windows/386
            artifact: ssh-tunnel-${{ github.ref_name }}-windows-386
            nsis: 'false' # wails 的 NSIS 不支持 386，否则报 "no windows targets"
          # macOS：Intel (amd64) + Apple Silicon (arm64) + 通用 (universal)
          - runs-on: macos-14
            wails-platform: darwin/amd64
            artifact: ssh-tunnel-${{ github.ref_name }}-darwin-amd64
          - runs-on: macos-14
            wails-platform: darwin/arm64
            artifact: ssh-tunnel-${{ github.ref_name }}-darwin-arm64
          - runs-on: macos-14
            wails-platform: darwin/universal
            artifact: ssh-tunnel-${{ github.ref_name }}-darwin-universal
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v2 在 Linux 上依赖 webkit2gtk-4.0 / gtk3 等系统库；
      # libayatana-appindicator3-dev 是项目用到的 systray 依赖。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            build-essential \
            pkg-config

      # 安装与 go.mod 中 wails 版本一致的 CLI（v2.12.0）
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # 计算注入版本号：tag 触发用 tag 名，手动触发回退为 dev
      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      # 构建。用 -o 直接指定规范产物名，避免后续 rename 猜测文件名失败。
      # -ldflags 通过 -X main.Version 注入版本号（app.go 的 Version 变量），供「关于」页显示。
      # -nsis 仅 Windows amd64/arm64 支持（wails 白名单），386 传 -nsis 会报错退出。
      # 注：wails 的 -o 不会自动补 .exe，Windows 需显式带后缀。
      - name: Build Wails app (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.wails-platform }} -clean -ldflags "-X main.Version=${{ steps.ver.outputs.version }}" -o "${{ matrix.artifact }}"

      # wails 的 -nsis 在找不到 makensis 时只打印一行警告就 `return nil`
      # （pkg/commands/build/nsis_installer.go），构建照常成功、安装包静默缺失。
      # windows-latest 没有预装 NSIS，必须自己装并把目录加进 PATH，
      # 否则整条链路一路绿灯却永远出不了 installer。
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows' && matrix.nsis == 'true'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 同一步里 PATH 还没生效，用全路径确认装好了
          & "C:\Program Files (x86)\NSIS\makensis.exe" -VERSION

      - name: Build Wails app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -platform ${{ matrix.wails-platform }} -clean ${{ matrix.nsis == 'true' && '-nsis' || '' }} -ldflags "-X main.Version=${{ steps.ver.outputs.version }}" -o "${{ matrix.artifact }}.exe"

      # macOS 的 -o 只改可执行文件名，不改 .app 目录名，故仍用 rename。
      - name: Build Wails app (macOS)
        if: runner.os == 'macOS'
        run: wails build -platform ${{ matrix.wails-platform }} -clean -ldflags "-X main.Version=${{ steps.ver.outputs.version }}"

      # Windows：重命名 NSIS 安装包（project.nsi 固定输出 ssh-tunnel-<arch>-installer.exe）。
      # 找不到就报错退出：以前这里是「警告并继续」，结果安装包缺失也能一路绿灯发版，
      # 而 Release Note 的下载表格里仍然宣传着安装包。
      - name: Rename NSIS installer (Windows)
        if: runner.os == 'Windows' && matrix.nsis == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          installers=(build/bin/*-installer.exe)
          shopt -u nullglob
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::未生成 NSIS 安装包。wails 在缺少 makensis 时会静默跳过，请检查 Install NSIS 步骤是否成功。"
            echo "--- build/bin 实际内容 ---"
            ls -la build/bin/ || true
            exit 1
          fi
          mv "${installers[0]}" "build/bin/${{ matrix.artifact }}-installer.exe"
          echo "✅ installer 已重命名: ${{ matrix.artifact }}-installer.exe"

      # macOS：.app 打包成 zip（ditto 保留权限/结构），用规范名
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --keepParent ssh-tunnel.app "${{ matrix.artifact }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/${{ matrix.artifact }}
            build/bin/${{ matrix.artifact }}.exe
            build/bin/${{ matrix.artifact }}-installer.exe
            build/bin/${{ matrix.artifact }}.zip
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (full history, for changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # 基于“上一个 tag → 当前 tag”之间的 commit 生成中文 Release Note，
      # 按 feat / fix / 其它 分类，直观体现本次相对上次的变化。
      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          CUR_TAG="${GITHUB_REF_NAME}"
          # 取上一个 tag（按创建时间倒序，跳过当前 tag）
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CUR_TAG}$" | head -1 || true)

          RANGE="${PREV_TAG:+$PREV_TAG..HEAD}"
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          fi

          echo "范围: ${RANGE:-所有提交}"

          # 分类提取 commit（去重 subject，去掉 trivial merge）
          feats=$(git log ${RANGE} --pretty=format:'%s' 2>/dev/null | grep -iE '^feat' | sed 's/^[^:]*: *//' | sort -u || true)
          fixes=$(git log ${RANGE} --pretty=format:'%s' 2>/dev/null | grep -iE '^fix' | sed 's/^[^:]*: *//' | sort -u || true)
          others=$(git log ${RANGE} --pretty=format:'%s' 2>/dev/null | grep -ivE '^(feat|fix|merge|chore|ci|docs|style|refactor|test|perf)(\(|:)' | sort -u || true)

          {
            echo "body<<EOF"
            echo "## 📦 下载"
            echo
            echo "| 平台 | 架构 | 文件 |"
            echo "| --- | --- | --- |"
            echo "| Linux | x64 | \`ssh-tunnel-${CUR_TAG}-linux-amd64\` |"
            echo "| Windows | x64 | \`ssh-tunnel-${CUR_TAG}-windows-amd64.exe\` / 安装包 \`...-amd64-installer.exe\` |"
            echo "| Windows | x86 | \`ssh-tunnel-${CUR_TAG}-windows-386.exe\` |"
            echo "| macOS | Intel | \`ssh-tunnel-${CUR_TAG}-darwin-amd64.zip\` |"
            echo "| macOS | Apple Silicon | \`ssh-tunnel-${CUR_TAG}-darwin-arm64.zip\` |"
            echo "| macOS | 通用 (Intel+ARM) | \`ssh-tunnel-${CUR_TAG}-darwin-universal.zip\` |"
            echo
            echo "> ⚠️ Wails v2 不支持 Linux x86(386)，Linux 仅提供 x64。Windows x86 仅提供免安装 exe（无 NSIS 安装包）。"
            echo

            if [ -n "$PREV_TAG" ]; then
              # 有上个版本：输出相对上次的变更日志
              echo "## 📝 变更日志"
              echo
              echo "相对 [\`${PREV_TAG}\`](../../releases/tag/${PREV_TAG}) 的变化："
              echo

              if [ -n "$feats" ]; then
                echo "### ✨ 新功能"
                echo "$feats" | sed 's/^/- /'
                echo
              fi
              if [ -n "$fixes" ]; then
                echo "### 🐛 问题修复"
                echo "$fixes" | sed 's/^/- /'
                echo
              fi
              if [ -n "$others" ]; then
                echo "### 📌 其它"
                echo "$others" | sed 's/^/- /'
                echo
              fi
              if [ -z "$feats" ] && [ -z "$fixes" ] && [ -z "$others" ]; then
                echo "_(无显著变更记录)_"
                echo
              fi
              echo "---"
              echo "> 完整提交历史见 [commits 比较](../../compare/${PREV_TAG}...${CUR_TAG})"
            else
              # 首次发布：无上个版本，不输出变更对比
              echo "## 🎉 首次发布"
              echo
              echo "这是 SSH Tunnel 的第一个正式版本。"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate-release-notes: true # 追加 GitHub 自动生成的 notes 作为补充
          files: |
            artifacts/*
